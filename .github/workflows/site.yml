name: Site

# Asks aw.tools to rebuild when the guide or the spec changes on main, and when
# a spec revision is frozen under a spec-r<N> tag. The token comes from the
# aw-tools-site-trigger App, which is installed on aw.tools alone; the
# site-trigger environment admits only main and spec-r* tags.

on:
  push:
    branches: [main]
    tags: ["spec-r*"]
    paths:
      - "guide/**"
      - "SPEC.md"

permissions: {}

jobs:
  rebuild:
    name: Rebuild the site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: site-trigger
    steps:
      - name: Mint a token for aw.tools
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SITE_APP_ID }}
          private-key: ${{ secrets.SITE_APP_PRIVATE_KEY }}
          owner: aw-tools
          repositories: aw.tools

      - name: Send the rebuild event
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh api repos/aw-tools/aw.tools/dispatches -f event_type=source-changed
