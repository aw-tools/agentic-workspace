name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VALE_VERSION: 3.22.0
  VALE_SHA256: 52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      guide: ${{ steps.areas.outputs.guide }}
      guide-lint-rules: ${{ steps.areas.outputs.guide-lint-rules }}
      workflows: ${{ steps.areas.outputs.workflows }}
      scripts: ${{ steps.areas.outputs.scripts }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Decide which areas changed
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit; every area counts as changed."
            printf '%s\n' guide=true guide-lint-rules=true workflows=true scripts=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          printf '%s\n' "$files"
          area() {
            if printf '%s\n' "$files" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          area guide '^(guide/|\.vale\.ini$|\.vale/|bin/lint-guide-budget$|\.github/workflows/ci\.yml$)'
          area guide-lint-rules '^(\.vale\.ini$|\.vale/|bin/test-lint-guide$|\.github/workflows/ci\.yml$)'
          area workflows '^\.github/workflows/'
          area scripts '^(bin/|\.github/workflows/ci\.yml$)'

  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dprint
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: dprint@0.55.1

      - name: Check formatting
        run: dprint check

  guide:
    name: Test guide
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.guide == 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run Vale and annotate the guide
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: ${{ env.VALE_VERSION }}
          files: guide
          sync: false
          filter_mode: nofilter
          fail_on_error: true

      - name: Check the word budget
        if: success() || failure()
        run: bin/lint-guide-budget

  guide-lint-rules:
    name: Test guide lint rules
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.guide-lint-rules == 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Vale
        run: |
          curl -fsSLo vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz -C /usr/local/bin vale
          vale --version

      - name: Test every rule against the fixture
        run: bin/test-lint-guide

  scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install shellcheck
        run: |
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Lint the scripts
        run: shellcheck bin/*

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version

      - name: Lint the workflows
        run: actionlint

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, format, guide, guide-lint-rules, scripts, workflows]
    if: always()
    steps:
      - name: Check every job
        run: |
          always=("${{ needs.changes.result }}" "${{ needs.format.result }}")
          conditional=("${{ needs.guide.result }}" "${{ needs.guide-lint-rules.result }}" "${{ needs.scripts.result }}" "${{ needs.workflows.result }}")
          for r in "${always[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "A job ended with result: $r"
              exit 1
            fi
          done
          for r in "${conditional[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "A job ended with result: $r"
              exit 1
            fi
          done
